name: Release

# A tag vX.Y.Z on main publishes, in this order: the GitHub release with its two zips, then the three npm
# packages, then a smoke test of the published installer. A release is never deleted and a published zip is
# never replaced: a rerun skips what is already published, and stops if a zip would change.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: The tag matches the versions, is on main and has its changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main, for the merge-base below

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: The tag matches the five versions
        run: pnpm version:check "$GITHUB_REF_NAME"

      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::le tag doit être sur main"; exit 1; }

      # --silent: without it, pnpm writes its "> node scripts/version.mts" banner to stdout, into the notes.
      - name: Take the notes from CHANGELOG.md
        run: pnpm --silent notes "$GITHUB_REF_NAME" > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub release and its zips
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: notes

      - name: Build the zips
        run: pnpm zips dist-zips

      - name: Create the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG existe déjà"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi

      # gh release upload without --clobber never replaces an asset; a zip already there is compared instead.
      - name: Attach the zips
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for path in dist-zips/*.zip; do
            zip=$(basename "$path")
            if grep -qxF "$zip" <<< "$assets"; then
              rm -rf old
              gh release download "$TAG" --pattern "$zip" --dir old
              cmp "$path" "old/$zip" \
                || { echo "::error::$zip déjà publié avec un autre contenu : sortir une nouvelle version"; exit 1; }
              echo "$zip déjà publié, identique"
            else
              gh release upload "$TAG" "$path"
            fi
          done

  npm:
    name: Publish the npm packages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC), no npm token
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm 11.5.1 or later
        run: |
          npm install -g npm@^11.5.1
          version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $version : il faut npm 11.5.1 ou plus récent"
            exit 1
          fi
          echo "npm $version"

      - run: pnpm install --frozen-lockfile

      # npm publish runs on these tarballs, never pnpm publish.
      - name: Pack the packages
        run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"

      # sdd last: the installer pins spec-trace and prototype at its own version, they must exist before it.
      # npm view exits non-zero on a 404, the version is then not published yet.
      - name: Publish the versions not yet on npm
        run: |
          for pkg in spec-trace prototype sdd; do
            tgz=$(ls "$RUNNER_TEMP"/packs/artefact-ci-"$pkg"-*.tgz)
            name=$(tar -xzOf "$tgz" package/package.json | jq -r .name)
            version=$(tar -xzOf "$tgz" package/package.json | jq -r .version)
            if [ -n "$(npm view "$name@$version" version 2> /dev/null || true)" ]; then
              echo "$name@$version déjà publié, sauté"
            else
              npm publish "$tgz" --access public
            fi
          done

  smoke:
    name: Smoke test of the published installer
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set a git identity
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.com'

      - name: Wait for the version on npm
        run: |
          v="${GITHUB_REF_NAME#v}"
          for try in $(seq 10); do
            if [ -n "$(npm view "@artefact-ci/sdd@$v" version 2> /dev/null || true)" ]; then
              exit 0
            fi
            echo "Essai $try : @artefact-ci/sdd@$v pas encore visible"
            sleep 30
          done
          echo "::error::@artefact-ci/sdd@$v n'est pas visible sur npm"
          exit 1

      - name: npx @artefact-ci/sdd init on a blank repo
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd "$(mktemp -d)"
          git init
          npx -y "@artefact-ci/sdd@$v" init
          jq -e --arg v "$v" '.version == $v and .source == "release"' .specify/artefact.json \
            || { echo "::error::.specify/artefact.json ne donne pas $v (release)"; exit 1; }
          jq -e --arg v "$v" '.presets["artefact-sdd"].version == $v' .specify/presets/.registry \
            || { echo "::error::le preset artefact-sdd n'est pas en $v"; exit 1; }
          jq -e --arg v "$v" '.extensions["artefact-product"].version == $v' .specify/extensions/.registry \
            || { echo "::error::l'extension artefact-product n'est pas en $v"; exit 1; }
