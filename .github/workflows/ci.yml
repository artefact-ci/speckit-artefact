name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  SPECIFY: uvx --from specify-cli==1.3.2 specify

jobs:
  preset:
    name: Install the preset and the extension on a blank project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check that the preset and the extension name no stack
        run: |
          if grep -rnE '\bnx\b|libs/|apps/|pnpm' preset/ extension/ --exclude=README.md; then
            echo "::error::a stack is cited: move it to .specify/stack.yml or to the project docs"
            exit 1
          fi

      - name: Create a blank Spec Kit 1.3.2 project
        run: |
          mkdir "$RUNNER_TEMP/blank"
          cd "$RUNNER_TEMP/blank"
          # specify init first: --non-interactive refuses a directory that is not empty, .git included.
          # --ignore-agent-tools: the runner has no claude CLI, and the skills do not need it to be written.
          $SPECIFY init --here --integration claude --script sh --non-interactive --ignore-agent-tools
          git init

      - name: Add the preset in dev mode
        working-directory: ${{ runner.temp }}/blank
        run: $SPECIFY preset add --dev "$GITHUB_WORKSPACE/preset"

      - name: Add the extension in dev mode
        working-directory: ${{ runner.temp }}/blank
        run: $SPECIFY extension add --dev "$GITHUB_WORKSPACE/extension"

      - name: Check the preset sections in the skills
        working-directory: ${{ runner.temp }}/blank
        run: |
          for command in specify plan tasks analyze implement converge; do
            grep -q '(artefact-sdd)' ".claude/skills/speckit-$command/SKILL.md" \
              || { echo "::error::speckit-$command has no (artefact-sdd) section"; exit 1; }
          done

      - name: Check the extension skills and their aliases
        working-directory: ${{ runner.temp }}/blank
        run: |
          for command in prd design epics prototype; do
            for skill in "speckit-artefact-product-$command" "speckit-$command"; do
              test -f ".claude/skills/$skill/SKILL.md" \
                || { echo "::error::skill $skill is missing"; exit 1; }
            done
          done

      - name: Layer the Nx preset example above artefact-sdd
        working-directory: ${{ runner.temp }}/blank
        run: |
          $SPECIFY preset add --dev "$GITHUB_WORKSPACE/examples/nx-preset" --priority 5
          .specify/scripts/bash/resolve-template.sh plan-template | grep -q 'libs/api' \
            || { echo "::error::the Nx plan template does not take precedence"; exit 1; }

  packages:
    name: Test and pack the npm tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Pack the packages and run spec-trace from its tarball
        run: |
          pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
          npx -y --package="$RUNNER_TEMP/packs/artefact-ci-spec-trace-0.0.0.tgz" spec-trace \
            | grep -q 'Aucune spec dans specs/' \
            || { echo "::error::spec-trace does not run from its tarball"; exit 1; }
          npx -y --package="$RUNNER_TEMP/packs/artefact-ci-prototype-0.0.0.tgz" prototype --help \
            | grep -q 'Usage : prototype' \
            || { echo "::error::prototype does not run from its tarball"; exit 1; }
