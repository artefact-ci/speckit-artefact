# .specify/stack.yml : API Bun + Hono sans front (exemple : avia-agent, à valider en phase 6b)
version: 1
branches:
  base: dev
  production: main
docs:
  - AGENTS.md
commands:
  test: bun test {file}
  affected: bun run lint && bun run typecheck && bun test
  check: bun run check
  trace: bunx @artefact-ci/spec-trace
tests:
  globs: ['src/**/*.test.ts']
ui: null # pas de front : /speckit-design et /speckit-prototype sautent ces étapes
e2e: null
