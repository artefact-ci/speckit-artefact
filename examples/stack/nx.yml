# .specify/stack.yml : nx-react-nestjs (Nx, NestJS, React)
version: 1
branches:
  base: dev
  production: main
docs:
  - AGENTS.md
  - apps/web/AGENTS.md
  - libs/web/AGENTS.md
commands:
  test: pnpm nx test {project}
  affected: pnpm nx affected -t lint typecheck test e2e
  fresh: pnpm nx affected -t lint typecheck test e2e --skip-nx-cache
  check: pnpm check
  trace: pnpm -s spec:trace
tests:
  globs: ['**/*.spec.ts', '**/*.spec.tsx']
shared:
  - libs/api/core
  - libs/shared/contracts
  - libs/web/data-access
  - apps/auth
ui:
  components: libs/web/ui
  storybook: true
  theme: libs/web/ui/src/lib/styles/theme.css
e2e:
  dir: apps/web-e2e
  setup: pnpm exec playwright install chromium
  needs: [docker]
